- heading "High-sensitivity secret handling" [level=3]
- paragraph: Saved provider keys are encrypted locally with server-side WordPress secrets. If you need stronger operational control, configure the provider through a WordPress constant or environment variable instead of storing the key in the database.
- paragraph: If WordPress salts change later, encrypted saved keys will need to be entered again.
