---
name: Release Prep

'on':
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to release from.
        required: true
        default: staging
        type: string
      target_branch:
        description: Live branch to receive the release PR.
        required: true
        default: master
        type: string
      bump:
        description: Semantic version bump.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit version override. Leave blank to auto-increment.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  BUN_VERSION: '1.3.0'
  PHP_VERSION: '8.3'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Install admin app dependencies
        working-directory: admin-app
        run: bun install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          set -euo pipefail
          args=("${{ inputs.bump }}")
          if [[ -n "${{ inputs.version }}" ]]; then
            args+=("${{ inputs.version }}")
          fi
          php scripts/bump-release-version.php "${args[@]}"
          version="$(php -r '$contents = file_get_contents("sentient-forms.php"); preg_match("/^\\s*\\*\\s*Version:\\s*(.+)$/mi", $contents, $m); echo trim($m[1]);')"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Rebuild WordPress admin assets
        working-directory: admin-app
        run: bun run build:wp

      - name: Verify release package preflight
        run: |
          php scripts/scan-wporg-package.php --source-tree
          php scripts/audit-wporg-licenses.php
          php scripts/validate-wporg-readme.php --offline

      - name: Commit release prep branch
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          branch="release/wp-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add sentient-forms.php readme.txt admin-app/package.json assets/dist
          if git diff --cached --quiet; then
            echo "No release-prep changes to commit."
          else
            git commit -m "chore(release): prepare Sentient Forms ${VERSION}"
          fi
          git push --force-with-lease origin "${branch}"
          echo "BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Open or update release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base "${{ inputs.target_branch }}" --head "${BRANCH}" --json number --jq '.[0].number // empty')"
          body=$'## Release\n\n- Version: '"${VERSION}"$'\n- Tag after merge: '"${TAG}"$'\n- Source branch: `${{ inputs.source_branch }}`\n- Target branch: `${{ inputs.target_branch }}`\n\n## Preflight\n\n- `scan-wporg-package.php --source-tree`\n- `audit-wporg-licenses.php`\n- `validate-wporg-readme.php --offline`'
          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" --title "chore(release): prepare Sentient Forms ${VERSION}" --body "${body}"
          else
            gh pr create \
              --base "${{ inputs.target_branch }}" \
              --head "${BRANCH}" \
              --title "chore(release): prepare Sentient Forms ${VERSION}" \
              --body "${body}"
          fi
