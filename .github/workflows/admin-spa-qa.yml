name: Admin SPA QA

on:
  push:
    paths:
      - 'wp-plugin/admin-app/**'
      - 'wp-plugin/assets/dist/**'
      - 'wp-plugin/package.json'
      - 'wp-plugin/.github/workflows/admin-spa-qa.yml'
  pull_request:
    paths:
      - 'wp-plugin/admin-app/**'
      - 'wp-plugin/assets/dist/**'
      - 'wp-plugin/package.json'
      - 'wp-plugin/.github/workflows/admin-spa-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-plugin/admin-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.0'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bun/install/cache
            wp-plugin/admin-app/node_modules
          key: bun-admin-app-${{ hashFiles('wp-plugin/admin-app/bun.lock') }}
          restore-keys: |
            bun-admin-app-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('wp-plugin/admin-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run QA suite
        env:
          BUNDLE_MAX_KB: '380'
          CI: 'true'
        run: bun run qa:full

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            wp-plugin/admin-app/playwright-report
            wp-plugin/admin-app/test-results
          if-no-files-found: ignore
