---
name: Admin SPA QA

'on':
  push:
    paths:
      - 'admin-app/**'
      - 'assets/dist/**'
      - '.github/workflows/admin-spa-qa.yml'
  pull_request:
    paths:
      - 'admin-app/**'
      - 'assets/dist/**'
      - '.github/workflows/admin-spa-qa.yml'

env:
  BUN_VERSION: '1.3.0'

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify cache inputs
        run: |
          test -f bun.lock
          test -f package.json

      - name: Cache Bun install artifacts
        id: bun-cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('admin-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('admin-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Report cache state
        run: |
          echo "bun version: $BUN_VERSION"
          echo "bun.lock hash: ${{ hashFiles('admin-app/bun.lock') }}"
          echo "Bun cache hit: ${{ steps.bun-cache.outputs.cache-hit }}"
          echo "Playwright cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Run QA suite
        env:
          BUNDLE_MAX_KB: '740'
          CI: 'true'
        run: bun run --bun qa:full

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            admin-app/playwright-report
            admin-app/test-results
          if-no-files-found: ignore
