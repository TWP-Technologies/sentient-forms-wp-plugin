---
name: WordPress.org SVN Publish

'on':
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to stage, e.g. v0.3.11.
        required: true
        default: v0.3.11
        type: string
      mode:
        description: Dry-run stages and uploads SVN evidence; publish commits after environment approval.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirm:
        description: Required for publish. Enter sentient-forms/<version>, e.g. sentient-forms/0.3.11.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wporg-svn-publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  WPORG_SVN_ARTIFACT_RETENTION_DAYS: '30'

jobs:
  prepare:
    name: Prepare SVN Dry Run
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate-inputs.outputs.version }}
      expected-confirm: ${{ steps.validate-inputs.outputs.expected-confirm }}
    steps:
      - name: Validate publish inputs
        id: validate-inputs
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_TAG}" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "::error::tag must match vMAJOR.MINOR.PATCH, got '${INPUT_TAG}'."
            exit 1
          fi
          if [[ "${INPUT_MODE}" != "dry-run" && "${INPUT_MODE}" != "publish" ]]; then
            echo "::error::mode must be dry-run or publish, got '${INPUT_MODE}'."
            exit 1
          fi
          version="${INPUT_TAG#v}"
          expected_confirm="sentient-forms/${version}"
          if [[ "${INPUT_MODE}" == "publish" && "${INPUT_CONFIRM}" != "${expected_confirm}" ]]; then
            echo "::error::publish mode requires confirm='${expected_confirm}'."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "expected-confirm=${expected_confirm}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install SVN publish tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq rsync subversion unzip

      - name: Stage SVN changes without committing
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          bash scripts/sync-wporg-svn.sh \
            --tag "${INPUT_TAG}" \
            --mode dry-run \
            --confirm "${INPUT_CONFIRM}" \
            --artifact-dir "${RUNNER_TEMP}/wporg-svn-dry-run-artifacts" \
            --work-dir "${RUNNER_TEMP}/wporg-svn-dry-run-work"

      - name: Upload dry-run SVN evidence
        uses: actions/upload-artifact@v7
        with:
          name: wporg-svn-dry-run-${{ steps.validate-inputs.outputs.version }}
          path: ${{ runner.temp }}/wporg-svn-dry-run-artifacts
          if-no-files-found: error
          retention-days: ${{ env.WPORG_SVN_ARTIFACT_RETENTION_DAYS }}

  publish:
    name: Publish to WordPress.org SVN
    if: ${{ inputs.mode == 'publish' }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: wporg-svn-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install SVN publish tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq rsync subversion unzip

      - name: Publish release package to SVN
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          WPORG_SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/sync-wporg-svn.sh \
            --tag "${INPUT_TAG}" \
            --mode publish \
            --confirm "${INPUT_CONFIRM}" \
            --artifact-dir "${RUNNER_TEMP}/wporg-svn-publish-artifacts" \
            --work-dir "${RUNNER_TEMP}/wporg-svn-publish-work"

      - name: Upload publish SVN evidence
        uses: actions/upload-artifact@v7
        with:
          name: wporg-svn-publish-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/wporg-svn-publish-artifacts
          if-no-files-found: error
          retention-days: ${{ env.WPORG_SVN_ARTIFACT_RETENTION_DAYS }}
