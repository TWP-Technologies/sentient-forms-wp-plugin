---
name: Full QA

'on':
  push:
    branches:
      - production
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.0'
  PHP_VERSION: '8.3'

jobs:
  changes:
    name: Full QA Changes
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      full_qa: ${{ steps.classify.outputs.full_qa }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install YAML validator
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Validate workflow and classifier contracts
        run: |
          php -l scripts/classify-full-qa-changes.php
          php -l scripts/require-full-qa-gates.php
          php -l scripts/tests/check-full-qa-classifier.php
          php -l scripts/tests/check-full-qa-required-gate.php
          python3 -c 'compile(open("scripts/tests/check-full-qa-workflow.py", encoding="utf-8").read(), "scripts/tests/check-full-qa-workflow.py", "exec")'
          php scripts/tests/check-full-qa-classifier.php
          php scripts/tests/check-full-qa-required-gate.php
          python3 scripts/tests/check-full-qa-workflow.py
          php scripts/validate-workflow-path-filters.php
          bash scripts/check-yaml.sh

      - name: Classify required QA
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            php scripts/classify-full-qa-changes.php --force >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == 'pull_request' ]]; then
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" \
              | php scripts/classify-full-qa-changes.php >> "$GITHUB_OUTPUT"
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            php scripts/classify-full-qa-changes.php --force >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only "$BEFORE_SHA" "$HEAD_SHA" \
              | php scripts/classify-full-qa-changes.php >> "$GITHUB_OUTPUT"
          fi

  full_qa:
    name: Full QA
    needs: changes
    if: ${{ needs.changes.outputs.full_qa == 'true' }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: sentient_forms_wpdb
          MYSQL_USER: sf_wp_user
          MYSQL_PASSWORD: your_strong_user_password_here
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify cache inputs
        run: |
          test -f composer.lock
          test -f admin-app/bun.lock

      - name: Cache Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            vendor
          key: ${{ runner.os }}-full-qa-composer-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-full-qa-composer-php${{ env.PHP_VERSION }}-

      - name: Cache Bun install artifacts
        id: bun-cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('admin-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('admin-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: mysqli

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for database
        env:
          MYSQL_PWD: rootpass
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot && break || sleep 2;
          done

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Report cache state
        run: |
          echo "bun version: $BUN_VERSION"
          echo "composer.lock hash: ${{ hashFiles('composer.lock') }}"
          echo "admin-app/bun.lock hash: ${{ hashFiles('admin-app/bun.lock') }}"
          echo "Composer cache hit: ${{ steps.composer-cache.outputs.cache-hit }}"
          echo "Bun cache hit: ${{ steps.bun-cache.outputs.cache-hit }}"
          echo "Playwright cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"

      - name: Run full QA script
        env:
          SKIP_CPS: '1'
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_DB_NAME: sentient_forms_wpdb
          WP_TESTS_DB_USER: sf_wp_user
          WP_TESTS_DB_PASSWORD: your_strong_user_password_here
          RUN_HEALTH_CHECK: '0'
          SENTIENT_FORMS_CPS_BASE_URL: http://localhost:10081/v2
          CI: 'true'
        run: ./scripts/run-full-qa.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            admin-app/playwright-report
            admin-app/test-results
          if-no-files-found: ignore

  required_full_qa:
    name: Full QA Required Gate
    if: ${{ always() }}
    needs: [changes, full_qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require classified producers
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          FULL_QA_REQUIRED: ${{ needs.changes.outputs.full_qa }}
          FULL_QA_RESULT: ${{ needs.full_qa.result }}
        run: php scripts/require-full-qa-gates.php
