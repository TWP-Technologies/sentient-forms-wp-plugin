name: Full QA

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'

jobs:
  full-qa:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: sentient_forms_wpdb
          MYSQL_USER: sf_wp_user
          MYSQL_PASSWORD: your_strong_user_password_here
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Bun install artifacts
        id: bun-cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('admin-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('admin-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Verify cache inputs
        run: |
          test -f composer.lock
          test -f admin-app/bun.lock

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for database
        env:
          MYSQL_PWD: rootpass
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot && break || sleep 2;
          done

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'

      - name: Report cache state
        run: |
          echo "composer.lock hash: ${{ hashFiles('composer.lock') }}"
          echo "admin-app/bun.lock hash: ${{ hashFiles('admin-app/bun.lock') }}"
          echo "Composer cache hit: ${{ steps.composer-cache.outputs.cache-hit }}"
          echo "Bun cache hit: ${{ steps.bun-cache.outputs.cache-hit }}"
          echo "Playwright cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"

      - name: Run full QA script
        env:
          SKIP_CPS: '1'
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_DB_NAME: sentient_forms_wpdb
          WP_TESTS_DB_USER: sf_wp_user
          WP_TESTS_DB_PASSWORD: your_strong_user_password_here
          RUN_HEALTH_CHECK: '0'
          SENTIENT_FORMS_CPS_BASE_URL: http://localhost:10081/v1
          CI: 'true'
        run: ./scripts/run-full-qa.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            admin-app/playwright-report
            admin-app/test-results
          if-no-files-found: ignore
