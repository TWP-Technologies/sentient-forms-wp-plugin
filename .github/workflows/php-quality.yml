---
name: PHP Quality

'on':
  push:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpunit.xml'
      - '.github/workflows/php-quality.yml'
  pull_request:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpunit.xml'
      - '.github/workflows/php-quality.yml'

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Verify cache inputs
        run: test -f composer.lock

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli

      - name: Report cache state
        run: |
          echo "composer.lock hash: ${{ hashFiles('composer.lock') }}"
          echo "Composer cache hit: ${{ steps.composer-cache.outputs.cache-hit }}"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer phpcs

  phpunit:
    runs-on: ubuntu-latest
    needs: phpcs
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
    continue-on-error: ${{ matrix.php-version == '8.4' }}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: sentient_forms_wpdb
          MYSQL_USER: sf_wp_user
          MYSQL_PASSWORD: your_strong_user_password_here
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/composer
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Verify cache inputs
        run: test -f composer.lock

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mysqli

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for database
        env:
          MYSQL_PWD: rootpass
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot && break || sleep 2;
          done

      - name: Report cache state
        run: |
          echo "composer.lock hash: ${{ hashFiles('composer.lock') }}"
          echo "Composer cache hit: ${{ steps.composer-cache.outputs.cache-hit }}"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        env:
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_DB_NAME: sentient_forms_wpdb
          WP_TESTS_DB_USER: sf_wp_user
          WP_TESTS_DB_PASSWORD: your_strong_user_password_here
        run: vendor/bin/phpunit
